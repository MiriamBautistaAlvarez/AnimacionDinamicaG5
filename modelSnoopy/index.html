<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agbalumo&display=swap" rel="stylesheet">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
    <style>
      h1{
        font-family: "Agbalumo", system-ui;
        font-weight: 400;
        font-style: normal;
        text-align: center;
        color: #F6F7FB;
        font-size: 48 px;
      }
      body{
        background-color: #50B4D8;
      }
      model-viewer{
        background-color: #50B4D8;
      }
    </style>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
      <h1>Merry Christmas!</h1>
    <model-viewer src="snoopy_holidays.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1">
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  
    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  </body>
</html>
